<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FLAMINGO // PLAYGROUND</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:         #000d1a;
    --ink:        #00e5ff;
    --ink-dim:    #006080;
    --ink-bright: #80f0ff;
    --amber:      #ffb400;
    --red:        #ff3333;
    --font:       "VT323", "IBM Plex Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000508;
    color: var(--ink);
    font-family: var(--font);
    font-size: 18px;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    min-width: 280px;
    background: #00080f;
    border-right: 1px solid var(--ink-dim);
    box-shadow: 2px 0 12px rgba(0,229,255,0.1);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 16px;
    overflow-y: auto;
  }

  #sidebar h1 {
    font-size: 22px;
    font-weight: normal;
    color: var(--ink-bright);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 6px var(--ink);
    border-bottom: 1px solid var(--ink-dim);
    padding-bottom: 10px;
  }
  #sidebar h1 .sub {
    display: block;
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 2px;
    margin-top: 2px;
    text-shadow: none;
  }

  #new-chat-btn, #cookbook-btn {
    font-family: var(--font);
    font-size: 17px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 6px 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    /* text-shadow: 0 0 4px var(--ink); */
    transition: background .15s, color .15s;
    width: 100%;
    text-align: left;
  }
  #new-chat-btn:hover { background: var(--ink); color: var(--bg); text-shadow: none; }
  #cookbook-btn { border-color: var(--amber); color: var(--amber); }
  #cookbook-btn:hover { background: var(--amber); color: #000; text-shadow: none; }

  /* model dropdown */
  #model-dropdown { position: relative; width: 100%; }
  #model-selected {
    font-family: var(--font);
    font-size: 16px;
    background: #000d1a;
    border: 1px solid var(--ink-dim);
    color: var(--ink-dim);
    padding: 6px 10px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: border-color .2s, color .2s;
    width: 100%;
  }
  #model-selected:hover { border-color: var(--ink); color: var(--ink); }
  #model-options {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: #000d1a;
    border: 1px solid var(--ink);
    box-shadow: 0 0 12px rgba(0,229,255,0.15);
    z-index: 999;
    max-height: 200px;
    overflow-y: auto;
  }
  #model-options.open { display: block; }
  .model-option {
    font-family: var(--font);
    font-size: 15px;
    padding: 6px 10px;
    color: var(--ink-dim);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid #000810;
    transition: background .1s, color .1s;
  }
  .model-option:hover  { background: var(--ink); color: #000; }
  .model-option.active { color: var(--ink-bright); }

  /* system prompt */
  #system-prompt-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #system-prompt-box label {
    font-size: 12px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #system-prompt {
    font-family: var(--font);
    font-size: 15px;
    background: #000d1a;
    border: 1px solid var(--ink-dim);
    color: var(--ink);
    padding: 8px;
    resize: vertical;
    outline: none;
    min-height: 80px;
    max-height: 160px;
    line-height: 1.5;
    transition: border-color .2s;
  }
  #system-prompt:focus { border-color: var(--ink); }
  #system-prompt::placeholder { color: var(--ink-dim); opacity: .5; }

  /* history */
  #history-panel { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .hist-title {
    font-size: 12px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    border-bottom: 1px solid var(--ink-dim);
    padding-bottom: 4px;
  }
  .hist-item {
    border: 1px solid var(--ink-dim);
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: border-color .2s, background .2s;
  }
  .hist-item:hover { border-color: var(--ink); background: #000d1a; }
  .hist-model   { font-size: 13px; color: var(--ink-bright); }
  .hist-preview { font-size: 12px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-meta    { font-size: 11px; color: var(--ink-dim); opacity: .6; }
  .del-btn {
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: var(--font);
    font-size: 12px;
    cursor: pointer;
    opacity: .5;
  }
  .del-btn:hover { color: var(--red); opacity: 1; }

  #sidebar-footer {
    margin-top: auto;
    font-size: 12px;
    color: var(--ink-dim);
    opacity: .4;
    line-height: 1.6;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── Main ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #000d18 0%, #00080f 100%);
  }

  /* messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 0;
    scroll-behavior: smooth;
    font-size: 17px;
    line-height: 1.7;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--ink-dim); }

  .term-line { display: block; white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
  .term-line.user {
    color: var(--ink-bright);
    text-shadow: 0 0 4px var(--ink);
    margin-top: 14px;
  }
  .term-line.user::before { content: "> "; color: var(--ink-bright); }
  .term-line.bot  { color: var(--ink); }
  .term-line.bot::before  { content: "$ "; color: var(--ink-dim); }
  .term-line.system-line {
    color: var(--amber);
    font-size: 14px;
    opacity: .7;
    margin-bottom: 8px;
  }

  /* typing */
  .typing { display: flex; gap: 6px; padding: 4px 0; align-items: center; }
  .typing span {
    width: 8px; height: 16px;
    background: var(--ink);
    box-shadow: 0 0 6px var(--ink);
    animation: blink 1s steps(2) infinite;
  }
  .typing span:nth-child(2) { animation-delay: .33s; }
  .typing span:nth-child(3) { animation-delay: .66s; }
  @keyframes blink { 50% { opacity: 0; } }

  /* cursor */
  .cursor {
    display: inline-block;
    width: 10px; height: 18px;
    background: var(--ink);
    box-shadow: 0 0 8px var(--ink);
    animation: blink 1s steps(2) infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  /* input bar */
  #input-bar {
    padding: 10px 28px 14px;
    border-top: 1px solid var(--ink-dim);
    display: flex;
    gap: 10px;
    align-items: center;
    background: #000810;
    box-shadow: 0 -4px 12px rgba(0,229,255,0.08);
  }
  #input-prefix { color: var(--ink-bright); font-size: 20px; text-shadow: 0 0 4px var(--ink); flex-shrink: 0; }
  #question {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--ink-dim);
    color: var(--ink-bright);
    font-size: 15px;
    font-family: var(--font);
    padding: 4px 2px;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
    /* text-shadow: 0 0 4px var(--ink); */
  }
  #question::placeholder { color: var(--ink-dim); }
  #question:disabled { opacity: .3; cursor: not-allowed; }

  #stop-btn {
    display: none;
    font-family: var(--font);
    font-size: 18px;
    background: transparent;
    border: 2px solid var(--red);
    color: var(--red);
    padding: 4px 14px;
    cursor: pointer;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  #send-btn {
    font-family: var(--font);
    font-size: 15px;
    background: transparent;
    border: 1px solid var(--ink-dim);
    color: var(--ink);
    padding: 6px 14px;
    cursor: pointer;
    text-transform: uppercase;
    /* text-shadow: 0 0 4px var(--ink); */
    transition: background .15s, color .15s;
    flex-shrink: 0;
  }
  #send-btn:hover:not(:disabled) { background: var(--ink); color: var(--bg); text-shadow: none; }
  #send-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* loading overlay */
  #loading-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  #loading-overlay.show { display: flex; }
  #loading-overlay p {
    font-family: var(--font);
    font-size: 20px;
    color: var(--ink);
    text-shadow: 0 0 8px var(--ink);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .load-bar { width: 200px; height: 10px; border: 1px solid var(--ink-dim); overflow: hidden; }
  .load-bar-inner {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(to right, var(--ink) 0 8px, transparent 8px 10px);
    box-shadow: 0 0 6px var(--ink);
    animation: loading-fill 1.5s ease-in-out infinite;
  }
  @keyframes loading-fill { 0% { width: 0%; } 50% { width: 80%; } 100% { width: 100%; } }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside id="sidebar">
  <h1>FLAMINGO <span class="sub">// PLAYGROUND</span></h1>

  <button id="cookbook-btn" onclick="window.location.href='http://localhost:5000'">[ DATA ANALYST ]</button>
  <button id="cookbook-btn" onclick="window.location.href='http://localhost:5000/rag.html'">
  [ RAG PIPELINE ]
</button>
  <button id="new-chat-btn" onclick="newChat()">[ + NEW SESSION ]</button>

  <!-- model selector -->
  <div id="model-dropdown">
    <div id="model-selected" onclick="toggleDropdown()">-- SELECT MODEL --</div>
    <div id="model-options"></div>
  </div>

  <!-- system prompt -->
  <div id="system-prompt-box">
    <label>System Prompt</label>
    <textarea id="system-prompt" placeholder="You are a helpful assistant...">You are a helpful assistant.</textarea>
  </div>

  <!-- history -->
  <div id="history-panel">
    <div class="hist-title"> Recent Chats</div>
    <div id="hist-list"></div>
  </div>

  <div id="sidebar-footer">
    FLAMINGO · OLLAMA · PRIVATE<br>
  </div>
</aside>

<!-- ── Main ── -->
<main id="main">
  <div id="messages">
    <div class="term-line system-line">
      // FLAMINGO PLAYGROUND — talk to any local model freely <span class="cursor"></span>
    </div>
  </div>
  <div id="input-bar">
    <span id="input-prefix">&gt;</span>
    <textarea id="question" rows="1" placeholder="ENTER QUERY..."></textarea>
    <button id="stop-btn" onclick="stopQuery()">[ STOP ]</button>
    <button id="send-btn" onclick="sendMessage()">[ SEND ]</button>
  </div>
</main>

<!-- Loading overlay -->
<div id="loading-overlay">
  <p id="loading-msg">LOADING...</p>
  <div class="load-bar"><div class="load-bar-inner"></div></div>
</div>

<script>
  const API          = "http://localhost:5000";
  let currentChatId  = null;
  let currentRequest = null;
  let chatHistory    = [];   // in-memory conversation history for context

  // ── Model selector ────────────────────────────────────────────────────────
  async function loadModels() {
    try {
      const res  = await fetch(`${API}/models`);
      const data = await res.json();
      const opts = document.getElementById("model-options");
      if (!data.models.length) {
        document.getElementById("model-selected").textContent = "NO MODELS FOUND";
        opts.innerHTML = `<div class="model-option" style="color:var(--red)">NO MODELS FOUND</div>`;
        return;
      }
      opts.innerHTML = data.models.map(m => `
        <div class="model-option ${m === data.current ? "active" : ""}"
             onclick="switchModel('${m}')">
          ${m}
        </div>
      `).join("");
      document.getElementById("model-selected").textContent = data.current || data.models[0];
    } catch {
      document.getElementById("model-selected").textContent = "OLLAMA OFFLINE";
    }
  }

  function toggleDropdown() {
    document.getElementById("model-options").classList.toggle("open");
  }

  document.addEventListener("click", e => {
    if (!document.getElementById("model-dropdown").contains(e.target)) {
      document.getElementById("model-options").classList.remove("open");
    }
  });

  async function switchModel(model) {
    document.getElementById("model-options").classList.remove("open");
    await fetch(`${API}/set_model`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ model }),
    });
    document.getElementById("model-selected").textContent = model;
    addBotLine(`MODEL SWITCHED TO: ${model}`);
  }

  // ── Send message ──────────────────────────────────────────────────────────
  document.getElementById("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  async function sendMessage() {
    const q          = document.getElementById("question").value.trim();
    const systemPmt  = document.getElementById("system-prompt").value.trim();
    const model      = document.getElementById("model-selected").textContent;

    if (!q || model === "NO MODELS FOUND" || model === "OLLAMA OFFLINE") return;

    // create new chat session if needed
    if (!currentChatId) {
      currentChatId = Date.now().toString(36);
      chatHistory   = [];
    }

    addUserLine(q);
    document.getElementById("question").value = "";
    document.getElementById("send-btn").disabled = true;
    document.getElementById("stop-btn").style.display = "block";

    // add to conversation history for context
    chatHistory.push({ role: "user", content: q });

    currentRequest = new AbortController();
    const typingEl = addTyping();

    try {
      const res  = await fetch(`${API}/playground/chat`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({
          chat_id:       currentChatId,
          model:         model,
          system_prompt: systemPmt,
          messages:      chatHistory,
        }),
        signal: currentRequest.signal,
      });
      const data = await res.json();
      typingEl.remove();

      if (data.error) {
        addBotLine(`ERROR: ${data.error}`);
      } else {
        addBotLine(data.answer);
        chatHistory.push({ role: "assistant", content: data.answer });
        loadHistory();
      }
    } catch(e) {
      typingEl.remove();
      if (e.name !== "AbortError") {
        addBotLine("ERROR: COULD NOT REACH SERVER.");
      }
    } finally {
      currentRequest = null;
      document.getElementById("send-btn").disabled = false;
      document.getElementById("stop-btn").style.display = "none";
      document.getElementById("question").focus();
    }
  }

  function stopQuery() {
    if (currentRequest) {
      currentRequest.abort();
      currentRequest = null;
    }
    fetch(`${API}/playground/cancel`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ chat_id: currentChatId }),
    });
    document.getElementById("send-btn").disabled = false;
    document.getElementById("stop-btn").style.display = "none";
    addBotLine("INTERRUPTED.");
  }

  // ── Chat History ──────────────────────────────────────────────────────────
  async function loadHistory() {
    try {
      const res   = await fetch(`${API}/playground/chats`);
      const chats = await res.json();
      const list  = document.getElementById("hist-list");
      if (!chats.length) {
        list.innerHTML = `<div style="font-size:12px;color:var(--ink-dim)">NO CHATS YET</div>`;
        return;
      }
      list.innerHTML = chats.map(c => `
        <div class="hist-item">
          <div class="hist-model">// ${c.model || "unknown"}</div>
          <div class="hist-preview" onclick="loadChat('${c.id}')">${c.preview}...</div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div class="hist-meta">${c.count} MESSAGES</div>
            <button class="del-btn" onclick="deleteChat('${c.id}')">[ DEL ]</button>
          </div>
        </div>
      `).join("");
    } catch { }
  }

  async function loadChat(chatId) {
    showLoading("LOADING CHAT...");
    try {
      const res  = await fetch(`${API}/playground/chats/${chatId}`);
      const data = await res.json();
      if (data.error) { alert(data.error); return; }

      currentChatId = chatId;
      chatHistory   = [];
      document.getElementById("messages").innerHTML = `
        <div class="term-line system-line">
          // FLAMINGO PLAYGROUND — talk to any local model freely <span class="cursor"></span>
        </div>`;

      const msgs = data.messages || [];
      for (const m of msgs) {
        if (m.role === "user") {
          addUserLine(m.content);
          chatHistory.push({ role: "user", content: m.content });
        } else if (m.role === "assistant") {
          addBotLine(m.content);
          chatHistory.push({ role: "assistant", content: m.content });
        }
      }

      // restore model if saved
      if (data.model) {
        document.getElementById("model-selected").textContent = data.model;
        await fetch(`${API}/set_model`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ model: data.model }),
        });
      }
    } catch { alert("FAILED TO LOAD CHAT."); }
    finally { hideLoading(); }
  }

  async function deleteChat(chatId) {
    await fetch(`${API}/playground/chats/${chatId}`, { method: "DELETE" });
    if (chatId === currentChatId) newChat();
    else loadHistory();
  }

  function newChat() {
    currentChatId = null;
    chatHistory   = [];
    document.getElementById("messages").innerHTML = `
      <div class="term-line system-line">
        // FLAMINGO PLAYGROUND — talk to any local model freely <span class="cursor"></span>
      </div>`;
    loadHistory();
  }

  // ── DOM helpers ───────────────────────────────────────────────────────────
  function addUserLine(text) {
    const el = document.createElement("div");
    el.className = "term-line user";
    el.innerHTML = esc(text);
    document.getElementById("messages").appendChild(el);
    scrollBottom();
  }

  function addBotLine(text) {
    const el = document.createElement("div");
    el.className = "term-line bot";
    el.innerHTML = esc(text);
    document.getElementById("messages").appendChild(el);
    scrollBottom();
  }

  function addTyping() {
    const el = document.createElement("div");
    el.className = "term-line bot";
    el.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    document.getElementById("messages").appendChild(el);
    scrollBottom();
    return el;
  }

  function scrollBottom() {
    const m = document.getElementById("messages");
    m.scrollTop = m.scrollHeight;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");
  }

  function showLoading(msg = "LOADING...") {
    document.getElementById("loading-msg").textContent = msg;
    document.getElementById("loading-overlay").classList.add("show");
  }

  function hideLoading() {
    document.getElementById("loading-overlay").classList.remove("show");
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  loadModels();
  loadHistory();
</script>
</body>
</html>
